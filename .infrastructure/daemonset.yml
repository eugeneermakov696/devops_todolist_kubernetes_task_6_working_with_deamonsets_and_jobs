apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: my-daemon-set
  namespace: mateapp
spec:
  selector:
    matchLabels:
      app: todoapp
  template:
    metadata:
      labels:
        app: todoapp
    spec:
      containers:
      - name: todoapp
        image: eug696/todoapp:3.0.0
        resources:
          requests:
            memory: "256Mi"
            cpu: "150m"
          limits:
            memory: "256Mi"
            cpu: "150m"
        command:
        - while true; do curl -s http://todoapp-service.todoapp.svc.cluster.local; sleep 5; done;
